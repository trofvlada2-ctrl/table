<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лендінг</title>
</head>
<body>

    
    <section id="features">
        <h2>Переваги</h2>
       
        <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>
        <span>Перевага 1</span>

        <svg width="24" height="24" viewBox="0 0 24 24"><rect width="20" height="20" x="2" y="2" fill="currentColor"/></svg>
        <span>Перевага 2</span>

        <svg width="24" height="24" viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="4"/></svg>
        <span>Перевага 3</span>
    </section>

        <section id="pricing">
        <h2>Тарифи</h2>
        <table>
            <caption>Таблиця тарифів</caption>
            <tr>
                <th scope="col">Характеристика</th>
                <th scope="col">Тариф 1</th>
                <th scope="col">Тариф 2</th>
                <th scope="col">Тариф 3</th>
            </tr>
            <tr>
                <th scope="row">Параметр 1</th>
                <td>Так</td>
                <td>Так</td>
                <td>Так</td>
            </tr>
            <tr>
                <th scope="row">Параметр 2</th>
                <td>Ні</td>
                <td>Так</td>
                <td>Так</td>
            </tr>
            <tr>
                
                <th scope="row">Параметр 3</th>
                <td>Ні</td>
                <td>Ні</td>
                <td>Так</td>
            </tr>
            <tr>
                <th scope="row">Параметр 4</th>
                <td>1 GB</td>
                <td>5 GB</td>
                <td>10 GB</td>
            </tr>
            <tr>
                <th scope="row">Параметр 5</th>
                <td>Базовий</td>
                <td>Pro</td>
                <td>VIP</td>
            </tr>
            <tr>
                <th scope="row">Ціна</th>
                <td>0</td>
                <td>100 грн</td>
                <td>200 грн</td>
            </tr>
        </table> 

   
    <section id="gallery">
        <h2>Галерея</h2>
    
        <img src="photo-400.jpg" srcset="photo-400.jpg 400w" alt="Фото 1" width="400" height="300">

        
        <picture>
            <source srcset="photo-400.jpg" type="image/jpeg">
            <img src="photo-400.jpg" srcset="photo-400.jpg 400w" alt="Фото 2" width="400" height="300" loading="lazy">
        </picture>

      
        <img src="photo-400.jpg" srcset="photo-400.jpg 400w" alt="Фото 3" width="400" height="300" loading="lazy">
        <img src="photo-400.jpg" srcset="photo-400.jpg 400w" alt="Фото 4" width="400" height="300" loading="lazy">
        <img src="photo-400.jpg" srcset="photo-400.jpg 400w" alt="Фото 5" width="400" height="300" loading="lazy">
        <img src="photo-400.jpg" srcset="photo-400.jpg 400w" alt="Фото 6" width="400" height="300" loading="lazy">
    </section>
    
    <section id="video">
        <h2>Відео</h2>
       <iframe width="560" height="315" src="https://www.youtube.com/embed/eBHiIp5hc7o" title="Відеопрезентація" allowfullscreen></iframe>
    </section>

</body>
</html>
